<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azeroth Vote</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Source+Sans+3:wght@400;600&display=swap">
<style>
/* Layout: one column. Pick (faction, race, class) on top, live tallies and a roster below. */
:root{--bg:#f4f2ee;--fg:#1d1b18;--muted:#6b665d;--card:#fffdf9;--line:#ded9cf;--gold:#8a6410;--alliance:#2a5cb8;--horde:#b3261e;--bar:#c9b27a;--sel:#8a6410;
--display:"Cinzel","Trajan Pro",Georgia,serif;--body:"Source Sans 3",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14120f;--fg:#ece6d8;--muted:#a39b8a;--card:#1f1c17;--line:#3a352c;--gold:#e0b552;--alliance:#6f9cf0;--horde:#f06a60;--bar:#8a6f33;--sel:#e0b552;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14120f;--fg:#ece6d8;--muted:#a39b8a;--card:#1f1c17;--line:#3a352c;--gold:#e0b552;--alliance:#6f9cf0;--horde:#f06a60;--bar:#8a6f33;--sel:#e0b552;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:32px}
h1{font-family:var(--display);font-size:clamp(28px,6vw,40px);margin:0;letter-spacing:.04em;color:var(--gold);text-wrap:balance}
h2{font-family:var(--display);font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 12px;color:var(--muted)}
p.sub{margin:6px 0 0;color:var(--muted)}
section{min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.opt{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;text-align:center;font-size:13px;line-height:1.2;background:var(--card);border:2px solid var(--line);border-radius:6px}
.opt:hover{border-color:var(--muted)}
.opt:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.opt[aria-pressed="true"]{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.opt[hidden]{display:none}
.opt img,.row img,.mini{width:40px;height:40px;border-radius:4px;display:block}
.fac{grid-template-columns:repeat(2,minmax(120px,1fr))}
.fac .opt{flex-direction:row;justify-content:center;gap:12px;font-size:16px;padding:12px}
.fac img{width:48px;height:48px}
.A{color:var(--alliance)} .H{color:var(--horde)}
.status{min-height:22px;color:var(--muted);font-size:14px}
.tallies{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr));gap:28px 32px}
.row{display:grid;grid-template-columns:28px minmax(70px,150px) 1fr 22px;align-items:center;gap:10px;margin-bottom:6px;font-size:14px}
.row img{width:28px;height:28px}
.track{height:12px;background:var(--line);border-radius:3px;overflow:hidden}
.fill{height:100%;background:var(--bar);transition:width .3s}
.row.zero{opacity:.45}
.row b{font-variant-numeric:tabular-nums;text-align:right}
.facbar{display:flex;height:34px;border-radius:5px;overflow:hidden;font-weight:600;color:#fff;font-size:14px;margin-bottom:6px}
.facbar div{display:flex;align-items:center;padding:0 10px;min-width:0;white-space:nowrap}
.facbar .a{background:#2a5cb8}.facbar .h{background:#b3261e}
.roster{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.who{display:grid;grid-template-columns:minmax(80px,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.who .icons{display:flex;gap:6px}
.who .mini{width:34px;height:34px}
.who.me .nm{color:var(--gold);font-weight:600}
.who.none .nm{color:var(--muted)}
.empty{color:var(--muted);font-size:14px}
.namebox{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.namebox input{font:inherit;padding:9px 12px;border:2px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);min-width:0;flex:1 1 200px;max-width:320px}.namebox input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}body{margin:0}
</style></head><body>
<main>
  <header>
    <h1>Azeroth Vote</h1>
    <p class="sub">Pick your faction, race and class. Your choice saves right away and you can change it any time.</p>
  </header>

  <section>
    <h2>Your name</h2>
    <div class="namebox"><input id="name" maxlength="30" placeholder="e.g. Oscar" autocomplete="nickname"></div>
  </section>
  <section>
    <h2>Faction</h2>
    <div class="grid fac" id="pickFaction"></div>
  </section>
  <section>
    <h2>Race</h2>
    <div class="grid" id="pickRace"></div>
  </section>
  <section>
    <h2>Class</h2>
    <div class="grid" id="pickClass"></div>
  </section>
  <div class="status" id="status" role="status"></div>

  <section>
    <h2>The group so far <span id="count"></span></h2>
    <div id="facbar"></div>
    <div class="tallies">
      <div><h2>Races</h2><div id="tRace"></div></div>
      <div><h2>Classes</h2><div id="tClass"></div></div>
    </div>
  </section>

  <section>
    <h2>Who picked what</h2>
    <div class="roster" id="roster"><div class="empty" style="padding:12px 0">Loading votes…</div></div>
  </section>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
</body></html>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</body></html>
<script src="firebase-config.js?v=2"></script>
</body></html>

const byId=(a,id)=>a.find(x=>x.id===id);
let me={faction:null,race:null,cls:null}, votes={}, myId=null, db=null, names={};
const slug=s=>s.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
let myName='';try{myName=localStorage.getItem('wowpoll-name')||''}catch(e){}
const $=id=>document.getElementById(id);
const el=(t,c,txt)=>{const e=document.createElement(t);if(c)e.className=c;if(txt!=null)e.textContent=txt;return e};

function opt(item,pressed,onclick){
  const b=el('button','opt');b.type='button';b.setAttribute('aria-pressed',pressed);
  const i=el('img');i.src=item.icon;i.alt='';b.append(i,el('span',item.cls||'',item.name));
  b.onclick=onclick;return b;
}
function renderPickers(){
  const f=$('pickFaction');f.replaceChildren(...D.factions.map(x=>opt({...x,cls:x.id},me.faction===x.id,()=>choose('faction',x.id))));
  const races=D.races.filter(r=>!me.faction||r.f.includes(me.faction));
  $('pickRace').replaceChildren(...races.map(x=>opt(x,me.race===x.id,()=>choose('race',x.id))));
  $('pickClass').replaceChildren(...D.classes.map(x=>opt(x,me.cls===x.id,()=>choose('cls',x.id))));
}
let saveTimer=null;
function choose(k,v){
  if(k==='faction'){me.faction=v;const r=byId(D.races,me.race);if(r&&!r.f.includes(v))me.race=null}
  else if(k==='race'){me.race=v;const r=byId(D.races,v);if(r.f.length===1)me.faction=r.f}
  else me.cls=v;
  renderPickers();render();
  $('status').textContent=!myId?'Enter your name first so your vote is saved.':db?'Saving…':'Voting is not set up yet.';
  clearTimeout(saveTimer);
  saveTimer=setTimeout(save,250);
}
async function save(){
  saveTimer=null;
  if(!db)return;
  if(!myId){$('status').textContent='Enter your name first, then pick again.';return}
  try{await db.collection('votes').doc(myId).set({name:myName.trim(),faction:me.faction||null,race:me.race||null,cls:me.cls||null});$('status').textContent='Saved.'}
  catch(e){$('status').textContent='Could not save your vote ('+(e.code||'error')+').'}
}

function tally(list,key){const c={};for(const v of Object.values(votes))if(v[key])c[v[key]]=(c[v[key]]||0)+1;return c}
function tallyRows(items,counts,target){
  const max=Math.max(1,...Object.values(counts));
  const rows=[...items].sort((a,b)=>(counts[b.id]||0)-(counts[a.id]||0));
  target.replaceChildren(...rows.map(it=>{
    const n=counts[it.id]||0,r=el('div','row'+(n?'':' zero'));
    const i=el('img');i.src=it.icon;i.alt='';
    const t=el('div','track'),f=el('div','fill');f.style.width=(n/max*100)+'%';t.append(f);
    r.append(i,el('span','',it.name),t,el('b','',n));return r;
  }));
}
function render(){
  const ids=Object.keys(votes);
  $('count').textContent=ids.length?'· '+ids.length+' voted':'';
  const fc=tally(D.factions,'faction'),a=fc.A||0,h=fc.H||0;
  const fb=$('facbar');fb.replaceChildren();
  if(a+h){const w=el('div','facbar');
    if(a){const d=el('div','a','Alliance '+a);d.style.flex=a;w.append(d)}
    if(h){const d=el('div','h','Horde '+h);d.style.flex=h;w.append(d)}
    fb.append(w)}
  tallyRows(D.races,tally(D.races,'race'),$('tRace'));
  tallyRows(D.classes,tally(D.classes,'cls'),$('tClass'));
  const ro=$('roster');
  if(!ids.length){ro.replaceChildren(el('div','empty','No votes yet. Pick above to go first.'));ro.firstChild.style.padding='12px 0';return}
  ids.sort((x,y)=>((y===myId)-(x===myId))||(names[x]||'').localeCompare(names[y]||''));
  ro.replaceChildren(...ids.map(id=>{
    const v=votes[id],w=el('div','who'+(id===myId?' me':''));
    w.append(el('span','nm',id===myId?'You':(names[id]||'A friend')));
    const ic=el('div','icons');
    for(const [arr,k] of [[D.factions,'faction'],[D.races,'race'],[D.classes,'cls']]){
      const it=byId(arr,v[k]);if(!it)continue;
      const i=el('img','mini');i.src=it.icon;i.alt=it.name;i.title=it.name;ic.append(i)}
    w.append(ic);return w;
  }));
}
renderPickers();render();
$('name').value=myName;myId=slug(myName)||null;
$('name').addEventListener('input',e=>{myName=e.target.value;myId=slug(myName)||null;try{localStorage.setItem('wowpoll-name',myName)}catch(x){}
  if(myId&&votes[myId]){me={faction:votes[myId].faction,race:votes[myId].race,cls:votes[myId].cls};renderPickers()}render()});
try{
  if(typeof FIREBASE_CONFIG==='undefined'||!FIREBASE_CONFIG.projectId)throw 0;
  firebase.initializeApp(FIREBASE_CONFIG);db=firebase.firestore();
  db.collection('votes').onSnapshot(s=>{
    votes={};names={};s.docs.forEach(d=>{votes[d.id]=d.data();names[d.id]=d.data().name||''});
    if(!saveTimer&&myId&&votes[myId]){me={faction:votes[myId].faction,race:votes[myId].race,cls:votes[myId].cls};renderPickers()}
    render();
  },e=>{$('status').textContent='Could not load votes ('+e.code+').'});
}catch(e){$('roster').replaceChildren(el('div','empty','Could not start Firebase: '+(e&&e.message||'config missing')+'. Try a hard refresh.'))}
</script>
